name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: xvfb-run -a python -m pytest

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the installer
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: LidarrSoulseek-Setup
          path: dist/LidarrSoulseek-Setup-*.exe
          if-no-files-found: error
