name: Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: xvfb-run -a python -m pytest

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the installer
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: LidarrSoulseek-Setup
          path: dist/LidarrSoulseek-Setup-*.exe
          if-no-files-found: error

  # contents: write is only on this job. Pull requests and ordinary pushes
  # to main still upload the artifact above and do not publish a release.
  release:
    needs: [tests, installer]
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LidarrSoulseek-Setup
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must look like 1.3.0, got: ${version}" >&2
            exit 1
          fi
          tag="v${version}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "$tag" ]; then
            echo "Tag ${{ github.ref_name }} does not match VERSION file (${tag})." >&2
            exit 1
          fi
          asset="dist/LidarrSoulseek-Setup-${version}.exe"
          checksum="dist/LidarrSoulseek-Setup-${version}.exe.sha256"
          if [ ! -f "$asset" ]; then
            echo "Installer not found: $asset" >&2
            ls -la dist >&2 || true
            exit 1
          fi
          (
            cd dist
            sha256sum "LidarrSoulseek-Setup-${version}.exe"
          ) > "$checksum"
          notes=$(printf '%s\n' \
            "Windows installer for Lidarr Soulseek ${version}." \
            "" \
            "Download LidarrSoulseek-Setup-${version}.exe and run it. The first window asks for the Lidarr URL, API key, and Soulseek login." \
            "" \
            "Installed copies of 1.4.0 and later can install this from Help → Check for updates. The .sha256 file is the installer checksum." \
            "" \
            "ffmpeg is separate if you want FLAC converted to MP3: winget install Gyan.FFmpeg.")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" "$checksum" --clobber
          else
            gh release create "$tag" "$asset" "$checksum" \
              --title "Lidarr Soulseek ${version}" \
              --notes "$notes" \
              --target "${{ github.sha }}"
          fi
          echo "Published ${asset} and ${checksum} on ${tag}"
