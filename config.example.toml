# Copy this file to config.toml and fill in every CHANGEME value.
# Do not commit config.toml. It holds passwords and API keys.
# The desktop app edits these same values from Settings → Connection and Settings → Behavior.

[lidarr]
url = "http://127.0.0.1:8686"
# Quotes are required. An unquoted hex API key will fail to parse.
api_key = "CHANGEME"
# Path Lidarr itself uses when it scans the completed folder.
# If Lidarr runs as a Windows service on this same PC, this is the same
# as [paths].complete_dir below.
scan_path = "D:\\Media\\Incoming\\Soulseek"
# When on, an empty download queue after an artist asks Lidarr to import that folder.
auto_import_after_artist = false
# Which saved instance the worker uses. A file with only url and api_key is one instance named Home.
active = "Home"

# More Lidarr servers. The active name's url, api_key, and scan_path are what the worker uses.
# [[lidarr.instances]]
# name = "Home"
# url = "http://127.0.0.1:8686"
# api_key = "CHANGEME"
# scan_path = "D:\\Media\\Incoming\\Soulseek"

[soulseek]
username = "CHANGEME"
password = "CHANGEME"
listen_port = 2234
obfuscated_port = 2235
enable_upnp = true

[paths]
# Incomplete + raw Soulseek downloads land here first.
download_dir = "D:\\Media\\Incoming\\Soulseek-raw"
# Clean album folders Lidarr should import from.
complete_dir = "D:\\Media\\Incoming\\Soulseek"
# Optional: share part of your library so you are not only downloading.
# Leave empty to share nothing. Sharing at least something is recommended.
share_dir = ""
state_db = "state.sqlite3"
log_file = "lidarr-soulseek.log"

[search]
search_wait_seconds = 12
max_albums_per_cycle = 1
# Pause new album searches after this many real searches, until the next day. 0 does not cap the run.
max_albums_per_run = 40
# Skip live, compilation, single, and bootleg unless the Lidarr metadata profile allows them.
follow_metadata_profile = true
allow_live = false
allow_compilation = false
allow_single = false
allow_bootleg = false
# Leave blank to search every wanted artist. Otherwise only artists with this Lidarr tag.
wanted_tag = ""
# Who the worker searches first, and the Wanted list order.
# lidarr, name, missing_tracks, missing_albums, added, release, tried
search_order = "lidarr"
# asc or desc. Missing tracks + asc finishes small gaps first.
search_order_direction = "desc"
# Stay on one artist, then skip them for this many days.
focus_one_artist = true
artist_cooldown_days = 7
# Wanted/missing pages pulled per cycle (page size 250). Next cycle continues.
max_missing_pages = 20
# After album grabs, search Soulseek for individual missing tracks on partial albums.
fill_missing_tracks = true
max_tracks_per_cycle = 5
cycle_seconds = 300
retry_hours = 12
min_filename_ratio = 0.5
track_count_tolerance = 2
# Tried in order. MP3 folders win when both exist; FLAC/WAV are allowed as fallback.
preferred_extensions = ["mp3", "flac", "wav"]
min_mp3_bitrate = 320
# Convert lossless downloads to MP3 before Lidarr import. Requires ffmpeg on PATH.
convert_to_mp3 = true
convert_bitrate = 320
# Delete the original FLAC/WAV in Incomplete after Lidarr is asked to import the MP3.
delete_sources_after_import = true
# Delete leftover files in Incomplete when a download fails or is cancelled.
clean_incomplete_on_fail = true
# Also delete Incomplete files older than this many hours (0 disables the sweep).
incomplete_max_age_hours = 12
ignored_users = []
# Record the grab and do not download. A Lidarr grab stays paused so Lidarr does not import it.
dry_run = false
# Re-search albums Lidarr already has below the quality cutoff, on this schedule.
quality_upgrades = false
quality_upgrade_hours = 24

[bridge]
# Torznab indexer and qBittorrent Web API 2.11.2 on one port.
# Lidarr already imports a finished album from qBittorrent, so this is the client it tests.
# A SABnzbd entry would need a fake NZB. Download Station's API is narrower.
# Off by default. The standalone worker keeps searching either way.
#
# host is where Rummagarr listens:
#   127.0.0.1   this PC only. Lidarr on another machine cannot connect.
#   0.0.0.0     every interface, including Tailscale.
#   100.x.x.x   one interface, such as this PC's Tailscale address.
# advertise_host is the address written into Lidarr. Leave it blank to use the
# Tailscale 100.x address when host is 0.0.0.0.
# When host is not 127.0.0.1, the API key is required on every request except
# the qBittorrent version check Lidarr sends before it logs in. That key is
# also the download-client password. Allow the port in Windows Firewall.
# remote_path is the folder Lidarr uses for this same complete directory
# (a UNC share or a mapped drive). Blank means Lidarr sees the local path.
enabled = false
host = "127.0.0.1"
advertise_host = ""
remote_path = ""
port = 8788
api_key = ""
username = "rummagarr"
password = ""
category = "lidarr"

[notify]
discord_url = ""
ntfy_url = ""
on_import = true
on_review = true
plex_url = ""
plex_token = ""
plex_section = ""
jellyfin_url = ""
jellyfin_api_key = ""

[runtime]
# How many albums to search/download at the same time.
# 1 = one after another. 3–5 is faster. Higher can stall Soulseek.
concurrent_albums = 3
download_timeout_minutes = 90
# Local status page. Open http://127.0.0.1:8787 while the worker runs.
status_bind = "127.0.0.1"
status_port = 8787
# Desktop app: start downloading when the window opens.
start_on_launch = false
# Installed app: look for a newer GitHub Release when the window opens.
check_updates = true

[ui]
# Dark matches the sidebar. Light is the same layout with a light palette.
theme = "dark"
# Download all wanted asks before queueing. false skips that popup.
confirm_download_all = true
# An unexpected error can write a zip next to the log. The zip stays on this PC.
crash_bundle = false

[limits]
# Download all missing from a browsed user. A stricter number in that user's
# profile still wins. browse_daily_files is how many files one user can finish
# on this PC today, for browse downloads and for the worker.
browse_max_files = 25
browse_max_mb = 2048
browse_daily_files = 20
